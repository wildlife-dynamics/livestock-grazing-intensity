id: livestock_grazing_intensity
requirements:
- name: ecoscope-platform
  version: ==2.28.0
  channel: https://repo.prefix.dev/ecoscope-workflows/

- name: ecoscope-workflows-ext-custom
  version: ==0.1.5
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-eden
  version: ==0.0.12
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: pydeck
  version: ==0.9.2
  channel: conda-forge

- name: ecoscope-workflows-ext-distance-sample-counts
  version: ==1.1.6
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-mep
  version: ==1.11.2
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-wwf-virunga
  version: ==1.0.1
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-ste
  version: ==0.0.34
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped

rjsf-overrides:
  properties:
    events.properties.event_types.ecoscope:transform:
    - transformer: EarthRangerEnumResolver
      transformer_kws:
        type: event_type
        depends_on: properties.er_connection.properties.data_source.properties.name

workflow:
- name: Workflow Details
  id: workflow_details
  task: set_workflow_details
  partial:
    description: ''

- name: Data Source
  id: er_connection
  task: set_er_connection

- name: Time Range
  id: time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y %H:%M:%S'

- name: Dashboard Groupers
  id: dashboard_groupers
  task: set_groupers
  partial:
    groupers: null

- name: Livestock Movement Events
  id: events
  task: get_events
  partial:
    client: ${{ workflow.er_connection.return }}
    time_range: ${{ workflow.time_range.return }}
    include_details: true
    event_columns:
      - id
      - time
      - event_type
      - event_category
      - title
      - reported_by
      - created_at
      - serial_number
      - is_collection
      - event_details
      - geometry
    event_states: null
    include_null_geometry: true
    raise_on_empty: false
    include_updates: false
    include_related_events: false
    include_display_values: true
    force_point_geometry: true

- name: Base Maps
  id: base_maps
  task: set_base_maps

- name: Add Livestock Movement Date
  id: livestock_movement_dated
  task: extract_column_as_type
  partial:
    df: ${{ workflow.events.return }}
    column_name: time
    output_type: date
    output_column_name: date
    fan_out: true

- name: Filter out livestock events 
  id: filter_livestock_events
  task: filter_row_values 
  partial:
    df: ${{ workflow.livestock_movement_dated.return }}
    column: event_type
    values:
     - livestock_block_movement

- name: Filter out cattle count events 
  id: filter_cattle_count_events
  task: filter_row_values 
  partial:
    df: ${{ workflow.livestock_movement_dated.return }}
    column: event_type
    values:
     - cattle_count

- name: Grazing Block Features
  id: features_by_type
  task: get_features_by_type
  partial:
    client: ${{ workflow.er_connection.return }}
    raise_on_empty: false

- name: Estimate UTM Projection for Grazing Blocks
  id: grazing_block_utm_crs
  task: estimate_utm_crs
  partial:
    geodataframe: ${{ workflow.features_by_type.return }}

- name: Expand Livestock Movement Details
  id: livestock_movement_details
  task: normalize_json_column
  partial:
    df: ${{ workflow.livestock_movement_dated.return }}
    column: event_details
    skip_if_not_exists: true
    sort_columns: true

- name: Expand Cattle Count Details
  id: cattle_count_details
  task: normalize_json_column
  partial:
    df: ${{ workflow.filter_cattle_count_events.return }}
    column: event_details
    skip_if_not_exists: true
    sort_columns: true

- name: Clean Livestock Movement Column Names
  id: livestock_movement_cleaned
  task: drop_column_prefix
  partial:
    df: ${{ workflow.livestock_movement_details.return }}
    prefix: event_details__
    duplicate_strategy: suffix

- name: Clean Cattle Count Column Names
  id: cattle_count_cleaned
  task: drop_column_prefix
  partial:
    df: ${{ workflow.cattle_count_details.return }}
    prefix: event_details__
    duplicate_strategy: suffix

- name: Calculate Grazing Block Areas
  id: grazing_block_areas
  task: add_area_columns
  partial:
    crs: ${{ workflow.grazing_block_utm_crs.return }}
    gdf: ${{ workflow.features_by_type.return }}
    decimals: 2
    units:
    - ha
    prefix: area

- name: Rename Cattle Count Columns
  id: cattle_count_renamed
  task: map_columns
  partial:
    df: ${{ workflow.cattle_count_cleaned.return }}
    rename_columns:
      communityzone: Community/Zone
      count: Count
    drop_columns: []
    retain_columns: []
    raise_if_not_found: true
    duplicate_strategy: suffix

- name: Merge Livestock From/To Blocks
  id: livestock_block_movements
  task: merge_block_movements
  partial:
    events_df: ${{ workflow.livestock_movement_cleaned.return }}

# - name: Map Column Value
#   id: column_value
#   task: map_column_value
#   partial:
#     df: ${{ workflow.grazing_block_areas.return }}
#     col: name
#     mapping:
#       ESILALE ZONE: esilaleii
#       IRBAAN ZONE: irbaan
#       NKOILALE ZONE: nkoilale
#       OLESERE ZONE: olesere
#       OLKURROTO ZONE: olkurroto
#       OLOISUTI ZONE: oloisuti
#       PAYIA ZONE: payia
#     new_col: Grazing Zone
#     default: null
#     keep_unmapped: true

- name: Color Grazing Zone Boundaries
  id: zone_boundary_colors
  task: apply_color_map
  partial:
    df: ${{ workflow.grazing_block_areas.return }}
    input_column_name: feature_type
    colormap: BrBG
    output_column_name: grazing_zone_colors

- name: Keep Grazing Block ID, Name and Geometry
  id: grazing_block_geometry
  task: map_columns
  partial:
    df: ${{ workflow.grazing_block_areas.return }}
    retain_columns:
    - id
    - name
    - geometry
    drop_columns: []
    rename_columns: {}
    raise_if_not_found: true
    duplicate_strategy: suffix

- name: Calculate Grazing Metrics
  id: grazing_metrics
  task: build_grazing_metrics
  partial:
    events_df: ${{ workflow.livestock_block_movements.return }}
    cattle_df: ${{ workflow.cattle_count_renamed.return }}
    block_areas_ha: ${{ workflow.grazing_block_areas.return }}

- name: Draw Grazing Intensity Chart
  id: grazing_intensity_chart
  task: draw_grouped_line_time_series_chart
  partial:
    dataframe: ${{ workflow.grazing_metrics.return }}
    x_axis: Date in
    y_axis: Grazing intensity (cattle-days/ha)
    agg_function: mean
    time_frequency: Month
    group_column: Grazing Zone
    fill: true
    group_order: null
    ascending: true
    color_column: null
    plot_style: null
    line_style: null
    layout_style: null
    tick_frequency: null
    widget_id: null

- name: Draw Effective Grazing Intensity Chart
  id: effective_intensity_chart
  task: draw_grouped_line_time_series_chart
  partial:
    dataframe: ${{ workflow.grazing_metrics.return }}
    x_axis: Date in
    y_axis: Effective grazing intensity (cattle/ha over graze+rest cycle)
    agg_function: mean
    fill: true
    time_frequency: Month
    group_column: Grazing Zone
    group_order: null
    ascending: true
    color_column: null
    plot_style: null
    line_style: null
    layout_style: null
    tick_frequency: null
    widget_id: null

- name: Draw Stock Intensity Sparkline
  id: stock_intensity_sparkline
  task: draw_stat_sparkline
  partial:
    dataframe: ${{ workflow.grazing_metrics.return }}
    value_column: Stock intensity (cattle-days/ha)
    agg_function: mean
    time_column: Date in
    decimal_places: 2
    time_frequency: Month
    as_percent: false
    caption_column: null
    caption_agg_function: null
    caption_template: '{value:,.0f}'
    line_color: '#2f6b9a'

- name: Draw Stocking Density Sparkline
  id: stocking_density_sparkline
  task: draw_stat_sparkline
  partial:
    dataframe: ${{ workflow.grazing_metrics.return }}
    value_column: Stocking density (cattle/ha)
    agg_function: mean
    time_column: Date in
    time_frequency: Month
    as_percent: false
    decimal_places: 2
    caption_column: null
    caption_agg_function: null
    caption_template: '{value:,.0f}'
    line_color: '#2f6b9a'

- name: Draw Grazing to Rest Ratio Sparkline
  id: graze_rest_ratio_sparkline
  task: draw_stat_sparkline
  partial:
    dataframe: ${{ workflow.grazing_metrics.return }}
    value_column: Grazing to Rest ratio
    agg_function: mean
    time_column: Date in
    time_frequency: Month
    as_percent: false
    decimal_places: 2
    caption_column: null
    caption_agg_function: null
    caption_template: '{value:,.0f}'
    line_color: '#2f6b9a'

- name: Join Grazing Metrics to Block Geometry
  id: grazing_metrics_with_geometry
  task: merge_two_dataframes
  partial:
    right: ${{ workflow.grazing_block_geometry.return }}
    left: ${{ workflow.grazing_metrics.return }}
    how: left
    on: null
    left_on: Grazing Zone
    right_on: name
    left_index: false
    right_index: false
    fillna_value: null

- name: Save Stock Intensity Sparkline
  id: stock_intensity_sparkline_html
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    text: ${{ workflow.stock_intensity_sparkline.return }}

- name: Save Stocking Density Sparkline
  id: stocking_density_sparkline_html
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    text: ${{ workflow.stocking_density_sparkline.return }}

- name: Save Grazing to Rest Ratio Sparkline
  id: graze_rest_ratio_sparkline_html
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    text: ${{ workflow.graze_rest_ratio_sparkline.return }}

- name: Save Grazing Intensity Chart
  id: grazing_intensity_chart_html
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    text: ${{ workflow.grazing_intensity_chart.return }}

- name: Save Effective Grazing Intensity Chart
  id: effective_intensity_chart_html
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    text: ${{ workflow.effective_intensity_chart.return }}

- name: Convert Grazing Metrics to Map Data
  id: grazing_metrics_gdf
  task: dataframe_to_geodataframe
  partial:
    df: ${{ workflow.grazing_metrics_with_geometry.return }}
    drop_missing: false
    x_column: null
    y_column: null
    geometry_column: geometry
    crs: EPSG:4326
    to_crs: null

- name: Stock Intensity Widget
  id: stock_intensity_widget
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Stocking Intensity
    data: ${{ workflow.stock_intensity_sparkline_html.return }}

- name: Stocking Density Widget
  id: stocking_density_widget
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Stocking Density
    data: ${{ workflow.stocking_density_sparkline_html.return }}

- name: Grazing to Rest Ratio Widget
  id: graze_rest_ratio_widget
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Grazing to Rest Ratio
    data: ${{ workflow.graze_rest_ratio_sparkline_html.return }}

- name: Grazing Intensity Widget
  id: grazing_intensity_widget
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Grazing Intensity
    data: ${{ workflow.grazing_intensity_chart_html.return }}

- name: Effective Grazing Intensity Widget
  id: effective_intensity_widget
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Effective Grazing Intensity
    data: ${{ workflow.effective_intensity_chart_html.return }}

- name: Color Blocks by Cattle Count
  id: cattle_count_colors
  task: apply_choropleth_colormap
  partial:
    df: ${{ workflow.grazing_metrics_gdf.return }}
    count_column: Cattle count
    colormap_min: 0.15
    colormap_max: 0.995
    colormap: Blues
    fill_color_column: fill_color
    label_column: choropleth_label
    max_classes: 5

- name: Zoom Map to Grazing Blocks
  id: map_view_state
  task: compute_view_state_from_gdf
  partial:
    gdf: ${{ workflow.cattle_count_colors.return }}
    pitch: 0
    bearing: 0
    max_zoom: 18.0

- name: Grazing Zone Boundaries Layer
  id: zone_boundaries_layer
  task: create_geojson_layer
  partial:
    geodataframe: ${{ workflow.zone_boundary_colors.return }}
    layer_style:
      auto_highlight: false
      opacity: 1
      pickable: true
      filled: false
      stroked: true
      extruded: false
      wireframe: false
      get_fill_color: grazing_zone_colors
      get_line_color: '[0, 0, 0]'
      get_line_width: 1
      get_elevation: null
      get_point_radius: 1
      line_width_units: pixels
      line_width_scale: 1
      line_width_min_pixels: 0
      line_width_max_pixels: null
      line_miter_limit: 4
      line_joint_rounded: false
      elevation_scale: 1
      point_radius_units: pixels
      point_radius_scale: 1
      point_radius_min_pixels: 0
      point_radius_max_pixels: null
      billboard: false
    legend:
      title: Legend
      label_column: name
      color_column: grazing_zone_colors
      values:
      - label: Boundaries
        color: '#000000'
    tooltip_columns:
    - feature_type
    data_url: null

- name: Cattle Count Layer
  id: cattle_count_layer
  task: create_geojson_layer
  partial:
    geodataframe: ${{ workflow.cattle_count_colors.return }}
    layer_style:
      auto_highlight: false
      opacity: 0.65
      pickable: true
      filled: true
      stroked: true
      extruded: false
      wireframe: false
      get_fill_color: fill_color
      get_line_color: fill_color
      get_line_width: 1
      get_elevation: null
      get_point_radius: 1
      line_width_units: pixels
      line_width_scale: 1
      line_width_min_pixels: 0
      line_width_max_pixels: null
      line_miter_limit: 4
      line_joint_rounded: false
      elevation_scale: 1
      point_radius_units: pixels
      point_radius_scale: 1
      point_radius_min_pixels: 0
      point_radius_max_pixels: null
      billboard: false
    legend:
      title: Cattle Count
      label_column: choropleth_label
      color_column: fill_color
      sort: null
      label_suffix: null
    data_url: null
    tooltip_columns: null

- name: Combine Map Layers
  id: map_layers
  task: combine_deckgl_map_layers
  partial:
    static_layers: ${{ workflow.zone_boundaries_layer.return }}
    grouped_layers: ${{ workflow.cattle_count_layer.return }}

- name: Merge Grazing Intensity Widget
  id: grazing_intensity_views
  task: merge_widget_views
  partial:
    widgets:
    - ${{ workflow.grazing_intensity_widget.return }}

- name: Draw Livestock Count Map
  id: livestock_count_map
  task: draw_map
  partial:
    geo_layers: ${{ workflow.map_layers.return }}
    tile_layers: ${{ workflow.base_maps.return }}
    legend_style:
      placement: bottom-right
      format_title: true
    view_state: ${{ workflow.map_view_state.return }}
    static: false
    output_type: html
    title: ''
    max_zoom: 20

- name: Merge Effective Grazing Intensity Widget
  id: effective_intensity_views
  task: merge_widget_views
  partial:
    widgets:
    - ${{ workflow.effective_intensity_widget.return }}

- name: Merge Stock Intensity Widget
  id: stock_intensity_views
  task: merge_widget_views
  partial:
    widgets:
    - ${{ workflow.stock_intensity_widget.return }}

- name: Save Livestock Count Map
  id: livestock_count_map_html
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    text: ${{ workflow.livestock_count_map.return }}

- name: Merge Stocking Density Widget
  id: stocking_density_views
  task: merge_widget_views
  partial:
    widgets:
    - ${{ workflow.stocking_density_widget.return }}

- name: Livestock Count Map Widget
  id: livestock_count_map_widget
  task: create_map_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    data: ${{ workflow.livestock_count_map_html.return }}
    title: Livestock Count

- name: Merge Grazing to Rest Ratio Widget
  id: graze_rest_ratio_views
  task: merge_widget_views
  partial:
    widgets:
    - ${{ workflow.graze_rest_ratio_widget.return }}

- name: Merge Livestock Count Map Widget
  id: livestock_count_map_views
  task: merge_widget_views
  partial:
    widgets:
    - ${{ workflow.livestock_count_map_widget.return }}

- name: Save Grazing Metrics CSV
  id: grazing_metrics_csv
  task: persist_df
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.grazing_metrics.return }}
    filename: null
    filetype: csv
- name: Gather Dashboard
  id: dashboard
  task: gather_dashboard
  partial:
    details: ${{ workflow.workflow_details.return }}
    groupers: ${{ workflow.dashboard_groupers.return }}
    time_range: ${{ workflow.time_range.return }}
    widgets:
    - ${{ workflow.stock_intensity_views.return }}
    - ${{ workflow.stocking_density_views.return }}
    - ${{ workflow.graze_rest_ratio_views.return }}
    - ${{ workflow.grazing_intensity_views.return }}
    - ${{ workflow.effective_intensity_views.return }}
    - ${{ workflow.livestock_count_map_views.return }}

