- name: 'Data Check: Views'
  id: check_table_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.check_table_widget.return }}

- name: Gather Dashboard
  id: dashboard
  task: gather_dashboard
  partial:
    details: ${{ workflow.workflow_details.return }}
    groupers: ${{ workflow.groupers.return }}
    time_range: ${{ workflow.time_range.return }}
    widgets:
    - ${{ workflow.cattle_now_views.return }}
    - ${{ workflow.blocks_now_views.return }}
    - ${{ workflow.pressure_views.return }}
    - ${{ workflow.median_rest_views.return }}
    - ${{ workflow.too_soon_views.return }}
    - ${{ workflow.land_resting_views.return }}
    - ${{ workflow.load_map_views.return }}
    - ${{ workflow.rest_map_views.return }}
    - ${{ workflow.timeline_views.return }}
    - ${{ workflow.pressure_chart_views.return }}
    - ${{ workflow.rest_chart_views.return }}
    - ${{ workflow.load_heatmap_views.return }}
    - ${{ workflow.blocks_table_views.return }}
    - ${{ workflow.check_table_views.return }}
