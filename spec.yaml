id: livestock_grazing_intensity
requirements:
- name: ecoscope-platform
  version: ==2.28.0
  channel: https://repo.prefix.dev/ecoscope-workflows/
- name: ecoscope-workflows-ext-custom
  version: ==0.1.5
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
- name: ecoscope-workflows-ext-eden
  version: ==0.0.12
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
- name: pydeck
  version: ==0.9.2
  channel: conda-forge
- name: ecoscope-workflows-ext-distance-sample-counts
  version: ==1.1.6.dev0+gb9b5e7cf8.d20261111
  channel: file:///tmp/ecoscope-workflows-custom/release/artifacts/
- name: ecoscope-workflows-ext-mep
  version: ==1.11.2
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
- name: ecoscope-workflows-ext-wwf-virunga
  version: ==1.0.1
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
- name: ecoscope-workflows-ext-ste
  version: ==0.0.34
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped
workflow:
- name: Set Er Connection
  id: er_connection
  task: set_er_connection
- name: Set Time Range
  id: time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y %H:%M:%S'
- name: Get Events
  id: livestock_movement_events
  task: get_events
  partial:
    client: ${{ workflow.er_connection.return }}
    time_range: ${{ workflow.time_range.return }}
    include_details: true
    event_columns: &id001
    - id
    - time
    - event_type
    - event_category
    - title
    - reported_by
    - created_at
    - serial_number
    - is_collection
    - event_details
    - geometry
    event_states: null
    include_null_geometry: true
    raise_on_empty: false
    include_updates: false
    include_related_events: false
    include_display_values: true
    force_point_geometry: true
- name: Get Events
  id: cattle_count_events
  task: get_events
  partial:
    client: ${{ workflow.er_connection.return }}
    time_range: ${{ workflow.time_range.return }}
    include_details: true
    event_columns: *id001
    event_states: null
    include_null_geometry: true
    raise_on_empty: false
    include_updates: false
    include_related_events: false
    include_display_values: true
    force_point_geometry: true
- name: Extract Column As Type
  id: extract_cattle_count_date
  task: extract_column_as_type
  partial:
    df: ${{ workflow.cattle_count_events.return }}
    column_name: time
    output_type: date
    output_column_name: time
    fan_out: true
- name: Extract Column As Type
  id: extract_livestock_date
  task: extract_column_as_type
  partial:
    df: ${{ workflow.livestock_movement_events.return }}
    column_name: time
    output_type: date
    output_column_name: date
    fan_out: true
- name: Get Features By Type
  id: features_by_type
  task: get_features_by_type
  partial:
    client: ${{ workflow.er_connection.return }}
    raise_on_empty: false
- name: Estimate Utm Crs
  id: utm_crs
  task: estimate_utm_crs
  partial:
    geodataframe: ${{ workflow.features_by_type.return }}
- name: Normalize Json Column
  id: livestock_json_column
  task: normalize_json_column
  partial:
    df: ${{ workflow.extract_livestock_date.return }}
    column: event_details
    skip_if_not_exists: true
    sort_columns: true
- name: Normalize Json Column
  id: cattle_json_column
  task: normalize_json_column
  partial:
    df: ${{ workflow.extract_cattle_count_date.return }}
    column: event_details
    skip_if_not_exists: true
    sort_columns: true
- name: Drop livestock column prefix
  id: livestock_column_prefix
  task: drop_column_prefix
  partial:
    df: ${{ workflow.livestock_json_column.return }}
    prefix: event_details__
    duplicate_strategy: suffix
- name: Drop cattle column prefix
  id: cattle_column_prefix
  task: drop_column_prefix
  partial:
    df: ${{ workflow.cattle_json_column.return }}
    prefix: event_details__
    duplicate_strategy: suffix
- name: Add Area Columns
  id: area_columns
  task: add_area_columns
  partial:
    crs: ${{ workflow.utm_crs.return }}
    gdf: ${{ workflow.features_by_type.return }}
    decimals: 2
    units:
    - ha
    prefix: area
- name: Map Columns
  id: columns
  task: map_columns
  partial:
    df: ${{ workflow.cattle_column_prefix.return }}
    rename_columns:
      communityzone: Community/Zone
      count: Count
    drop_columns: &id002 []
    retain_columns: []
    raise_if_not_found: true
    duplicate_strategy: suffix
- name: Merge Block Movements
  id: block_movements
  task: merge_block_movements
  partial:
    events_df: ${{ workflow.livestock_column_prefix.return }}
- name: Map Column Value
  id: column_value
  task: map_column_value
  partial:
    df: ${{ workflow.area_columns.return }}
    col: name
    mapping:
      ESILALE ZONE: esilaleii
      IRBAAN ZONE: irbaan
      NKOILALE ZONE: nkoilale
      OLESERE ZONE: olesere
      OLKURROTO ZONE: olkurroto
      OLOISUTI ZONE: oloisuti
      PAYIA ZONE: payia
    new_col: Grazing Zone
    default: null
    keep_unmapped: true
- name: Apply Color Map
  id: color_map
  task: apply_color_map
  partial:
    df: ${{ workflow.column_value.return }}
    input_column_name: feature_type
    colormap: BrBG
    output_column_name: grazing_zone_colors
- name: Map Columns
  id: columns_2
  task: map_columns
  partial:
    df: ${{ workflow.column_value.return }}
    retain_columns:
    - id
    - Grazing Zone
    - geometry
    drop_columns: *id002
    rename_columns: {}
    raise_if_not_found: true
    duplicate_strategy: suffix
- name: Build Grazing Metrics
  id: grazing_metrics
  task: build_grazing_metrics
  partial:
    events_df: ${{ workflow.block_movements.return }}
    cattle_df: ${{ workflow.columns.return }}
    block_areas_ha: ${{ workflow.area_columns.return }}
- name: Draw Grouped Line Time Series Chart
  id: grouped_line_time_series_chart
  task: draw_grouped_line_time_series_chart
  partial:
    dataframe: ${{ workflow.grazing_metrics.return }}
    x_axis: Date in
    y_axis: Grazing intensity (cattle-days/ha)
    agg_function: mean
    time_frequency: Month
    group_column: Grazing Zone
    fill: true
    group_order: null
    ascending: true
    color_column: null
    plot_style: null
    line_style: null
    layout_style: null
    tick_frequency: null
    widget_id: null
- name: Draw Grouped Line Time Series Chart
  id: grouped_line_time_series_chart_2
  task: draw_grouped_line_time_series_chart
  partial:
    dataframe: ${{ workflow.grazing_metrics.return }}
    x_axis: Date in
    y_axis: Effective grazing intensity (cattle/ha over graze+rest cycle)
    agg_function: mean
    fill: true
    time_frequency: Month
    group_column: Grazing Zone
    group_order: null
    ascending: true
    color_column: null
    plot_style: null
    line_style: null
    layout_style: null
    tick_frequency: null
    widget_id: null
- name: Draw Stat Sparkline
  id: stock_intensity_sparkline
  task: draw_stat_sparkline
  partial:
    dataframe: ${{ workflow.grazing_metrics.return }}
    value_column: Stock intensity (cattle-days/ha)
    agg_function: mean
    time_column: Date in
    decimal_places: 2
    time_frequency: Month
    as_percent: false
    caption_column: null
    caption_agg_function: null
    caption_template: '{value:,.0f}'
    line_color: '#2f6b9a'
- name: Draw Stat Sparkline
  id: stock_density_sparkline
  task: draw_stat_sparkline
  partial:
    dataframe: ${{ workflow.grazing_metrics.return }}
    value_column: Stocking density (cattle/ha)
    agg_function: mean
    time_column: Date in
    time_frequency: Month
    as_percent: false
    decimal_places: 0
    caption_column: null
    caption_agg_function: null
    caption_template: '{value:,.0f}'
    line_color: '#2f6b9a'
- name: Draw Stat Sparkline
  id: stat_sparkline
  task: draw_stat_sparkline
  partial:
    dataframe: ${{ workflow.grazing_metrics.return }}
    value_column: Grazing to Rest ratio
    agg_function: mean
    time_column: Date in
    time_frequency: Month
    as_percent: false
    decimal_places: 0
    caption_column: null
    caption_agg_function: null
    caption_template: '{value:,.0f}'
    line_color: '#2f6b9a'
- name: Merge Two Dataframes
  id: two_dataframes
  task: merge_two_dataframes
  partial:
    right: ${{ workflow.columns_2.return }}
    left: ${{ workflow.grazing_metrics.return }}
    how: left
    'on': null
    left_on: null
    right_on: null
    left_index: false
    right_index: false
    fillna_value: null
- name: Persist Stock Intensity Text
  id: stock_intensity_text
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    text: ${{ workflow.stock_intensity_sparkline.return }}
- name: Persist Text
  id: text_4
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    text: ${{ workflow.stock_density_sparkline.return }}
- name: Persist Text
  id: text_3
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    text: ${{ workflow.stat_sparkline.return }}
- name: Persist Text
  id: text
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    text: ${{ workflow.grouped_line_time_series_chart.return }}
- name: Persist Text
  id: text_2
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    text: ${{ workflow.grouped_line_time_series_chart_2.return }}
- name: Dataframe To Geodataframe
  id: to_geodataframe
  task: dataframe_to_geodataframe
  partial:
    df: ${{ workflow.two_dataframes.return }}
    drop_missing: false
    x_column: null
    y_column: null
    geometry_column: geometry
    crs: EPSG:4326
    to_crs: null
- name: Create Stock Intensity Sparkline View
  id: plot_sparkline
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Stocking Intensity
    data: ${{ workflow.stock_intensity_text.return }}
- name: Create Plot Widget Single View
  id: plot_widget_single_view_3
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Stocking Density
    data: ${{ workflow.text_4.return }}
- name: Create Plot Widget Single View
  id: plot_widget_single_view_4
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Grazing to Rest Ratio
    data: ${{ workflow.text_3.return }}
- name: Create Plot Widget Single View
  id: plot_widget_single_view
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Grazing Intensity
    data: ${{ workflow.text.return }}
- name: Create Plot Widget Single View
  id: plot_widget_single_view_5
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Effective Grazing Intensity
    data: ${{ workflow.text_2.return }}
- name: Apply Choropleth Colormap
  id: choropleth_colormap
  task: apply_choropleth_colormap
  partial:
    df: ${{ workflow.to_geodataframe.return }}
    count_column: Cattle count
    colormap_min: 0.15
    colormap_max: 0.995
    colormap: Blues
    fill_color_column: fill_color
    label_column: choropleth_label
    max_classes: 5
- name: Compute View State From Gdf
  id: view_state_from_gdf
  task: compute_view_state_from_gdf
  partial:
    gdf: ${{ workflow.choropleth_colormap.return }}
    pitch: 0
    bearing: 0
    max_zoom: 18.0
- name: Create Geojson Layer
  id: geojson_layer_2
  task: create_geojson_layer
  partial:
    geodataframe: ${{ workflow.color_map.return }}
    layer_style:
      auto_highlight: false
      opacity: 1
      pickable: true
      filled: false
      stroked: true
      extruded: false
      wireframe: false
      get_fill_color: grazing_zone_colors
      get_line_color: '[0, 0, 0]'
      get_line_width: 1
      get_elevation: null
      get_point_radius: 1
      line_width_units: pixels
      line_width_scale: 1
      line_width_min_pixels: 0
      line_width_max_pixels: null
      line_miter_limit: 4
      line_joint_rounded: false
      elevation_scale: 1
      point_radius_units: pixels
      point_radius_scale: 1
      point_radius_min_pixels: 0
      point_radius_max_pixels: null
      billboard: false
    legend:
      title: Legend
      label_column: name
      color_column: grazing_zone_colors
      values:
      - label: Boundaries
        color: '#000000'
    tooltip_columns:
    - feature_type
    data_url: null
- name: Create Geojson Layer
  id: geojson_layer
  task: create_geojson_layer
  partial:
    geodataframe: ${{ workflow.choropleth_colormap.return }}
    layer_style:
      auto_highlight: false
      opacity: 0.65
      pickable: true
      filled: true
      stroked: true
      extruded: false
      wireframe: false
      get_fill_color: fill_color
      get_line_color: fill_color
      get_line_width: 1
      get_elevation: null
      get_point_radius: 1
      line_width_units: pixels
      line_width_scale: 1
      line_width_min_pixels: 0
      line_width_max_pixels: null
      line_miter_limit: 4
      line_joint_rounded: false
      elevation_scale: 1
      point_radius_units: pixels
      point_radius_scale: 1
      point_radius_min_pixels: 0
      point_radius_max_pixels: null
      billboard: false
    legend:
      title: Cattle Count
      label_column: choropleth_label
      color_column: fill_color
      sort: null
      label_suffix: null
    data_url: null
    tooltip_columns: null
- name: Combine Deckgl Map Layers
  id: deckgl_map_layers
  task: combine_deckgl_map_layers
  partial:
    static_layers: ${{ workflow.geojson_layer_2.return }}
    grouped_layers: ${{ workflow.geojson_layer.return }}
- name: Merge Widget Views
  id: widget_views_2
  task: merge_widget_views
  partial:
    widgets:
    - ${{ workflow.plot_widget_single_view.return }}
- name: Set Base Maps
  id: base_maps
  task: set_base_maps
  partial:
    base_maps:
    - url: https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}
      opacity: 1
      max_zoom: 20
      min_zoom: 0
    - url: https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
      opacity: 0.5
      max_zoom: 20
      min_zoom: 0
- name: Draw Map
  id: map_step
  task: draw_map
  partial:
    geo_layers: ${{ workflow.deckgl_map_layers.return }}
    tile_layers: ${{ workflow.base_maps.return }}
    legend_style:
      placement: bottom-right
      format_title: true
    view_state: ${{ workflow.view_state_from_gdf.return }}
    static: false
    output_type: html
    title: ''
    max_zoom: 20
- name: Merge Widget Views
  id: widget_views
  task: merge_widget_views
  partial:
    widgets:
    - ${{ workflow.plot_widget_single_view_5.return }}
- name: Merge Widget Views
  id: widget_views_5
  task: merge_widget_views
  partial:
    widgets:
    - ${{ workflow.plot_sparkline.return }}
- name: Persist Text
  id: text_5
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    text: ${{ workflow.map_step.return }}
- name: Merge Widget Views
  id: widget_views_4
  task: merge_widget_views
  partial:
    widgets:
    - ${{ workflow.plot_widget_single_view_3.return }}
- name: Create Map Widget Single View
  id: map_widget_single_view
  task: create_map_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    data: ${{ workflow.text_5.return }}
    title: Livestock Count
- name: Merge Widget Views
  id: widget_views_3
  task: merge_widget_views
  partial:
    widgets:
    - ${{ workflow.plot_widget_single_view_4.return }}
- name: Set Workflow Details
  id: workflow_details
  task: set_workflow_details
  partial:
    description: ''
- name: Merge Widget Views
  id: widget_views_6
  task: merge_widget_views
  partial:
    widgets:
    - ${{ workflow.map_widget_single_view.return }}
- name: Set Groupers
  id: groupers
  task: set_groupers
  partial:
    groupers: null
- name: Persist Df
  id: df
  task: persist_df
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.grazing_metrics.return }}
    filename: null
    filetype: csv
- name: Gather Dashboard
  id: dashboard
  task: gather_dashboard
  partial:
    details: ${{ workflow.workflow_details.return }}
    groupers: ${{ workflow.groupers.return }}
    time_range: ${{ workflow.time_range.return }}
    widgets:
    - ${{ workflow.widget_views_5.return }}
    - ${{ workflow.widget_views_4.return }}
    - ${{ workflow.widget_views_3.return }}
    - ${{ workflow.widget_views_2.return }}
    - ${{ workflow.widget_views.return }}
    - ${{ workflow.widget_views_6.return }}
rjsf-overrides:
  uiSchema:
    ui:order:
    - workflow_details
    - time_range
    - er_connection
    - livestock_movement_events
    - cattle_count_events
    - features_by_type
  properties:
    livestock_movement_events.properties.event_types.ecoscope:transform:
    - transformer: EarthRangerEnumResolver
      transformer_kws:
        type: event_type
        depends_on: properties.er_connection.properties.data_source.properties.name
    cattle_count_events.properties.event_types.ecoscope:transform:
    - transformer: EarthRangerEnumResolver
      transformer_kws:
        type: event_type
        depends_on: properties.er_connection.properties.data_source.properties.name
