id: livestock_grazing_intensity
requirements:

- name: ecoscope-platform
  version: ==2.28.0
  channel: https://repo.prefix.dev/ecoscope-workflows/

- name: ecoscope-workflows-ext-custom
  version: ==0.1.5
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: pydeck
  version: ==0.9.2
  channel: conda-forge

- name: ecoscope-workflows-ext-distance-sample-counts
  version: "1.2.2.*"
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-mep
  version: ==1.11.2
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-ste
  version: ==0.0.34
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped
rjsf-overrides:
  uiSchema:
    ui:order:
    - workflow_details
    - er_connection
    - time_range
    - features_by_type
    - rest_target
    - base_maps
workflow:

- name: Workflow Details
  id: workflow_details
  task: set_workflow_details

- name: Data Source
  id: er_connection
  task: set_er_connection

- name: Time Range
  id: time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y %H:%M:%S'

- name: Rest Target
  id: rest_target
  task: set_rest_target

- name: Group by Grazing Zone
  id: groupers
  task: set_groupers
  partial:
    groupers:
    - index_name: Grazing Zone

- name: Base Maps
  id: base_maps
  task: set_base_maps

- name: Livestock Movement Events
  id: livestock_movement_events
  task: get_events
  partial:
    client: ${{ workflow.er_connection.return }}
    time_range: ${{ workflow.time_range.return }}
    include_details: true
    event_columns:
    - id
    - time
    - event_type
    - event_category
    - title
    - reported_by
    - created_at
    - serial_number
    - is_collection
    - event_details
    - geometry
    event_states: []
    include_null_geometry: true
    raise_on_empty: false
    include_updates: false
    include_related_events: false
    include_display_values: true
    force_point_geometry: true
    event_types:
    - livestock_block_movement

- name: Cattle Count Events
  id: cattle_count_events
  task: get_events
  partial:
    client: ${{ workflow.er_connection.return }}
    time_range: ${{ workflow.time_range.return }}
    include_details: true
    event_columns:
    - id
    - time
    - event_type
    - event_category
    - title
    - reported_by
    - created_at
    - serial_number
    - is_collection
    - event_details
    - geometry
    event_states: []
    include_null_geometry: true
    raise_on_empty: false
    include_updates: false
    include_related_events: false
    include_display_values: true
    force_point_geometry: true
    event_types:
    - cattle_count

- name: Grazing Block Features
  id: features_by_type
  task: get_features_by_type
  partial:
    client: ${{ workflow.er_connection.return }}
    raise_on_empty: false

- name: Add Livestock Movement Date
  id: livestock_movement_dated
  task: extract_column_as_type
  partial:
    df: ${{ workflow.livestock_movement_events.return }}
    column_name: time
    output_type: date
    output_column_name: date
    fan_out: true

- name: Expand Livestock Movement Details
  id: livestock_movement_details
  task: normalize_json_column
  partial:
    df: ${{ workflow.livestock_movement_dated.return }}
    column: event_details
    skip_if_not_exists: true
    sort_columns: true

- name: Clean Livestock Movement Column Names
  id: livestock_movement_cleaned
  task: drop_column_prefix
  partial:
    df: ${{ workflow.livestock_movement_details.return }}
    prefix: event_details__
    duplicate_strategy: suffix

- name: Merge Livestock From/To Blocks
  id: livestock_block_movements
  task: merge_block_movements
  partial:
    events_df: ${{ workflow.livestock_movement_cleaned.return }}

- name: Convert Cattle Count Time to Date
  id: cattle_count_dated
  task: extract_column_as_type
  partial:
    df: ${{ workflow.cattle_count_events.return }}
    column_name: time
    output_type: date
    output_column_name: time
    fan_out: true

- name: Expand Cattle Count Details
  id: cattle_count_details
  task: normalize_json_column
  partial:
    df: ${{ workflow.cattle_count_dated.return }}
    column: event_details
    skip_if_not_exists: true
    sort_columns: true

- name: Clean Cattle Count Column Names
  id: cattle_count_cleaned
  task: drop_column_prefix
  partial:
    df: ${{ workflow.cattle_count_details.return }}
    prefix: event_details__
    duplicate_strategy: suffix

- name: Rename Cattle Count Columns
  id: cattle_count_renamed
  task: map_columns
  partial:
    df: ${{ workflow.cattle_count_cleaned.return }}
    rename_columns:
      communityzone: Community/Zone
      count: Count
    drop_columns: []
    retain_columns: []
    raise_if_not_found: true
    duplicate_strategy: suffix

- name: Estimate UTM Projection for Grazing Blocks
  id: grazing_block_utm_crs
  task: estimate_utm_crs
  partial:
    geodataframe: ${{ workflow.features_by_type.return }}

- name: Calculate Grazing Block Areas
  id: grazing_block_areas
  task: add_area_columns
  partial:
    crs: ${{ workflow.grazing_block_utm_crs.return }}
    gdf: ${{ workflow.features_by_type.return }}
    decimals: 2
    units:
    - ha
    prefix: area

- name: Work Out Each Stay
  id: stays
  task: build_grazing_metrics
  partial:
    events_df: ${{ workflow.livestock_block_movements.return }}
    cattle_df: ${{ workflow.cattle_count_renamed.return }}
    block_areas_ha: ${{ workflow.grazing_block_areas.return }}
    time_range: ${{ workflow.time_range.return }}
    rest_target_days: ${{ workflow.rest_target.return }}

- name: Summarise Grazing per Zone and Month
  id: zone_months
  task: summarize_grazing_by_month
  partial:
    events_df: ${{ workflow.livestock_block_movements.return }}
    cattle_df: ${{ workflow.cattle_count_renamed.return }}
    block_areas_ha: ${{ workflow.grazing_block_areas.return }}
    time_range: ${{ workflow.time_range.return }}
    group_by: zone

- name: Summarise Grazing per Block and Month
  id: block_months
  task: summarize_grazing_by_month
  partial:
    events_df: ${{ workflow.livestock_block_movements.return }}
    cattle_df: ${{ workflow.cattle_count_renamed.return }}
    block_areas_ha: ${{ workflow.grazing_block_areas.return }}
    time_range: ${{ workflow.time_range.return }}
    group_by: block

- name: Summarise Grazing per Block
  id: block_summary
  task: summarize_grazing_by_block
  partial:
    events_df: ${{ workflow.livestock_block_movements.return }}
    cattle_df: ${{ workflow.cattle_count_renamed.return }}
    block_areas_ha: ${{ workflow.grazing_block_areas.return }}
    time_range: ${{ workflow.time_range.return }}
    rest_target_days: ${{ workflow.rest_target.return }}

- name: Colour Blocks for the Maps
  id: styled_blocks
  task: style_grazing_blocks_for_map
  partial:
    by_block: ${{ workflow.block_summary.return }}

- name: Check the Reports for Problems
  id: data_check
  task: build_grazing_data_check
  partial:
    events_df: ${{ workflow.livestock_block_movements.return }}
    cattle_df: ${{ workflow.cattle_count_renamed.return }}
    block_areas_ha: ${{ workflow.grazing_block_areas.return }}

- name: Save Stays as CSV
  id: stays_csv
  task: persist_df
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.stays.return }}
    filename: grazing_stays
    filetype: csv

- name: Split Stays by Zone
  id: stay_groups
  task: split_groups
  partial:
    df: ${{ workflow.stays.return }}
    groupers: ${{ workflow.groupers.return }}

- name: Split Zone Months by Zone
  id: zone_month_groups
  task: split_groups
  partial:
    df: ${{ workflow.zone_months.return }}
    groupers: ${{ workflow.groupers.return }}

- name: Split Block Months by Zone
  id: block_month_groups
  task: split_groups
  partial:
    df: ${{ workflow.block_months.return }}
    groupers: ${{ workflow.groupers.return }}

- name: Split Blocks by Zone
  id: block_groups
  task: split_groups
  partial:
    df: ${{ workflow.styled_blocks.return }}
    groupers: ${{ workflow.groupers.return }}

- name: Split Data Check by Zone
  id: check_groups
  task: split_groups
  partial:
    df: ${{ workflow.data_check.return }}
    groupers: ${{ workflow.groupers.return }}

- name: 'Cattle in Blocks Now: Card'
  id: cattle_now
  task: draw_grazing_card
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.stay_groups.return }}
  partial:
    card: cattle_now

- name: 'Cattle in Blocks Now: Save'
  id: cattle_now_html
  task: persist_text
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.cattle_now.return }}
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename_suffix: cattle_now_card

- name: 'Cattle in Blocks Now: Widget'
  id: cattle_now_tile
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.cattle_now_html.return }}
  partial:
    title: Cattle in Blocks Now

- name: 'Cattle in Blocks Now: Views'
  id: cattle_now_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.cattle_now_tile.return }}

- name: 'Blocks in Use: Card'
  id: blocks_now
  task: draw_grazing_card
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.block_month_groups.return }}
  partial:
    card: blocks_in_use

- name: 'Blocks in Use: Save'
  id: blocks_now_html
  task: persist_text
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.blocks_now.return }}
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename_suffix: blocks_now_card

- name: 'Blocks in Use: Widget'
  id: blocks_now_tile
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.blocks_now_html.return }}
  partial:
    title: Blocks in Use

- name: 'Blocks in Use: Views'
  id: blocks_now_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.blocks_now_tile.return }}

- name: 'Grazing Pressure: Card'
  id: pressure
  task: draw_grazing_card
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.zone_month_groups.return }}
  partial:
    card: grazing_pressure

- name: 'Grazing Pressure: Save'
  id: pressure_html
  task: persist_text
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.pressure.return }}
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename_suffix: pressure_card

- name: 'Grazing Pressure: Widget'
  id: pressure_tile
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.pressure_html.return }}
  partial:
    title: Grazing Pressure

- name: 'Grazing Pressure: Views'
  id: pressure_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.pressure_tile.return }}

- name: 'Rest Before Return: Card'
  id: median_rest
  task: draw_grazing_card
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.stay_groups.return }}
  partial:
    card: median_rest_days

- name: 'Rest Before Return: Save'
  id: median_rest_html
  task: persist_text
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.median_rest.return }}
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename_suffix: median_rest_card

- name: 'Rest Before Return: Widget'
  id: median_rest_tile
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.median_rest_html.return }}
  partial:
    title: Rest Before Return

- name: 'Rest Before Return: Views'
  id: median_rest_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.median_rest_tile.return }}

- name: 'Returns Too Soon: Card'
  id: too_soon
  task: draw_grazing_card
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.stay_groups.return }}
  partial:
    card: returns_too_soon

- name: 'Returns Too Soon: Save'
  id: too_soon_html
  task: persist_text
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.too_soon.return }}
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename_suffix: too_soon_card

- name: 'Returns Too Soon: Widget'
  id: too_soon_tile
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.too_soon_html.return }}
  partial:
    title: Returns Too Soon

- name: 'Returns Too Soon: Views'
  id: too_soon_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.too_soon_tile.return }}

- name: 'Land Resting: Card'
  id: land_resting
  task: draw_grazing_card
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.zone_month_groups.return }}
  partial:
    card: land_resting_pct

- name: 'Land Resting: Save'
  id: land_resting_html
  task: persist_text
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.land_resting.return }}
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename_suffix: land_resting_card

- name: 'Land Resting: Widget'
  id: land_resting_tile
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.land_resting_html.return }}
  partial:
    title: Land Resting

- name: 'Land Resting: Views'
  id: land_resting_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.land_resting_tile.return }}

- name: Outline All Blocks and Zones
  id: boundaries_layer
  task: create_geojson_layer
  partial:
    geodataframe: ${{ workflow.features_by_type.return }}
    data_url: null
    tooltip_columns:
    - name
    layer_style:
      filled: false
      stroked: true
      get_line_color:
      - 40
      - 40
      - 40
      get_line_width: 1
      opacity: 0.6
    legend:
      title: Boundaries
      values:
      - label: Blocks and zones
        color: '#282828'

- name: Frame the Zone's Blocks
  id: map_frame
  task: envelope_gdf
  mapvalues:
    argnames:
    - gdf
    argvalues: ${{ workflow.block_groups.return }}
  partial:
    expansion_factor: 1.8

- name: Zoom Map to the Zone's Blocks
  id: map_view
  task: compute_view_state_from_gdf
  mapvalues:
    argnames:
    - gdf
    argvalues: ${{ workflow.map_frame.return }}
  partial:
    pitch: 0
    bearing: 0
    max_zoom: 15

- name: 'Grazing Load Map: Block Layer'
  id: load_map_layer
  task: create_geojson_layer
  mapvalues:
    argnames:
    - geodataframe
    argvalues: ${{ workflow.block_groups.return }}
  partial:
    data_url: null
    tooltip_columns:
    - Grazing block
    - Grazing Zone
    - Area (ha)
    - Times grazed
    - Days grazed
    - Grazing load (cattle-days/ha)
    - Shortest rest (days)
    - Days since last grazed
    - Cattle now
    - Rest status
    layer_style:
      filled: true
      stroked: true
      get_fill_color: load_colour
      get_line_color:
      - 255
      - 255
      - 255
      get_line_width: 2
      opacity: 0.9
    legend:
      title: Grazing load in the period
      label_column: load_class
      color_column: load_colour

- name: 'Grazing Load Map: Add Boundaries'
  id: load_map_layers
  task: combine_deckgl_map_layers
  mapvalues:
    argnames:
    - grouped_layers
    argvalues: ${{ workflow.load_map_layer.return }}
  partial:
    static_layers: ${{ workflow.boundaries_layer.return }}

- name: 'Grazing Load Map: Pair Layers with Zoom'
  id: load_map_inputs
  task: groupbykey
  skipif:
    conditions:
    - any_dependency_skipped
    - all_keyed_iterables_are_skips
    unpack_depth: 1
  partial:
    iterables:
    - ${{ workflow.load_map_layers.return }}
    - ${{ workflow.map_view.return }}

- name: 'Grazing Load Map: Draw'
  id: load_map
  task: draw_map
  mapvalues:
    argnames:
    - geo_layers
    - view_state
    argvalues: ${{ workflow.load_map_inputs.return }}
  partial:
    tile_layers: ${{ workflow.base_maps.return }}
    static: false
    output_type: html
    title: null
    legend_style:
      placement: bottom-right
    max_zoom: 18

- name: 'Grazing Load Map: Save'
  id: load_map_html
  task: persist_text
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.load_map.return }}
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename_suffix: load_map

- name: 'Grazing Load Map: Widget'
  id: load_map_widget
  task: create_map_widget_single_view
  skipif:
    conditions:
    - never
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.load_map_html.return }}
  partial:
    title: Grazing Load Map

- name: 'Grazing Load Map: Views'
  id: load_map_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.load_map_widget.return }}

- name: 'Rest Status Map: Block Layer'
  id: rest_map_layer
  task: create_geojson_layer
  mapvalues:
    argnames:
    - geodataframe
    argvalues: ${{ workflow.block_groups.return }}
  partial:
    data_url: null
    tooltip_columns:
    - Grazing block
    - Grazing Zone
    - Area (ha)
    - Times grazed
    - Days grazed
    - Grazing load (cattle-days/ha)
    - Shortest rest (days)
    - Days since last grazed
    - Cattle now
    - Rest status
    layer_style:
      filled: true
      stroked: true
      get_fill_color: status_colour
      get_line_color:
      - 255
      - 255
      - 255
      get_line_width: 2
      opacity: 0.9
    legend:
      title: Rest status at the end of the period
      label_column: Rest status
      color_column: status_colour

- name: 'Rest Status Map: Add Boundaries'
  id: rest_map_layers
  task: combine_deckgl_map_layers
  mapvalues:
    argnames:
    - grouped_layers
    argvalues: ${{ workflow.rest_map_layer.return }}
  partial:
    static_layers: ${{ workflow.boundaries_layer.return }}

- name: 'Rest Status Map: Pair Layers with Zoom'
  id: rest_map_inputs
  task: groupbykey
  skipif:
    conditions:
    - any_dependency_skipped
    - all_keyed_iterables_are_skips
    unpack_depth: 1
  partial:
    iterables:
    - ${{ workflow.rest_map_layers.return }}
    - ${{ workflow.map_view.return }}

- name: 'Rest Status Map: Draw'
  id: rest_map
  task: draw_map
  mapvalues:
    argnames:
    - geo_layers
    - view_state
    argvalues: ${{ workflow.rest_map_inputs.return }}
  partial:
    tile_layers: ${{ workflow.base_maps.return }}
    static: false
    output_type: html
    title: null
    legend_style:
      placement: bottom-right
    max_zoom: 18

- name: 'Rest Status Map: Save'
  id: rest_map_html
  task: persist_text
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.rest_map.return }}
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename_suffix: rest_map

- name: 'Rest Status Map: Widget'
  id: rest_map_widget
  task: create_map_widget_single_view
  skipif:
    conditions:
    - never
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.rest_map_html.return }}
  partial:
    title: Rest Status Map

- name: 'Rest Status Map: Views'
  id: rest_map_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.rest_map_widget.return }}

- name: 'Block Timeline: Draw'
  id: timeline
  task: draw_grazing_timeline
  mapvalues:
    argnames:
    - stays
    argvalues: ${{ workflow.stay_groups.return }}

- name: 'Block Timeline: Save'
  id: timeline_html
  task: persist_text
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.timeline.return }}
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename_suffix: timeline

- name: 'Block Timeline: Widget'
  id: timeline_widget
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.timeline_html.return }}
  partial:
    title: Block Timeline

- name: 'Block Timeline: Views'
  id: timeline_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.timeline_widget.return }}

- name: 'Grazing Pressure by Month: Draw'
  id: pressure_chart
  task: draw_grazing_pressure_by_month
  mapvalues:
    argnames:
    - monthly
    argvalues: ${{ workflow.zone_month_groups.return }}

- name: 'Grazing Pressure by Month: Save'
  id: pressure_chart_html
  task: persist_text
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.pressure_chart.return }}
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename_suffix: pressure_chart

- name: 'Grazing Pressure by Month: Widget'
  id: pressure_chart_widget
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.pressure_chart_html.return }}
  partial:
    title: Grazing Pressure by Month

- name: 'Grazing Pressure by Month: Views'
  id: pressure_chart_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.pressure_chart_widget.return }}

- name: 'Rest Before Each Return: Draw'
  id: rest_chart
  task: draw_rest_before_return
  mapvalues:
    argnames:
    - stays
    argvalues: ${{ workflow.stay_groups.return }}

- name: 'Rest Before Each Return: Save'
  id: rest_chart_html
  task: persist_text
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.rest_chart.return }}
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename_suffix: rest_chart

- name: 'Rest Before Each Return: Widget'
  id: rest_chart_widget
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.rest_chart_html.return }}
  partial:
    title: Rest Before Each Return

- name: 'Rest Before Each Return: Views'
  id: rest_chart_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.rest_chart_widget.return }}

- name: 'Grazing Load by Block and Month: Draw'
  id: load_heatmap
  task: draw_grazing_load_heatmap
  mapvalues:
    argnames:
    - block_months
    argvalues: ${{ workflow.block_month_groups.return }}

- name: 'Grazing Load by Block and Month: Save'
  id: load_heatmap_html
  task: persist_text
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.load_heatmap.return }}
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename_suffix: load_heatmap

- name: 'Grazing Load by Block and Month: Widget'
  id: load_heatmap_widget
  task: create_plot_widget_single_view
  skipif:
    conditions:
    - never
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.load_heatmap_html.return }}
  partial:
    title: Grazing Load by Block and Month

- name: 'Grazing Load by Block and Month: Views'
  id: load_heatmap_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.load_heatmap_widget.return }}

- name: 'Grazing Blocks: Draw'
  id: blocks_table
  task: draw_table
  mapvalues:
    argnames:
    - dataframe
    argvalues: ${{ workflow.block_groups.return }}
  partial:
    columns:
    - Grazing block
    - Area (ha)
    - Times grazed
    - Days grazed
    - Grazing load (cattle-days/ha)
    - Shortest rest (days)
    - Rest target (days)
    - Rest check
    - Rest status
    - Days since last grazed
    - Cattle now
    - Last grazed
    table_config:
      enable_sorting: true
      enable_filtering: true
      enable_download: true

- name: 'Grazing Blocks: Save'
  id: blocks_table_html
  task: persist_text
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.blocks_table.return }}
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename_suffix: blocks_table

- name: 'Grazing Blocks: Widget'
  id: blocks_table_widget
  task: create_table_widget_single_view
  skipif:
    conditions:
    - never
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.blocks_table_html.return }}
  partial:
    title: Grazing Blocks

- name: 'Grazing Blocks: Views'
  id: blocks_table_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.blocks_table_widget.return }}

- name: 'Data Check: Draw'
  id: check_table
  task: draw_table
  mapvalues:
    argnames:
    - dataframe
    argvalues: ${{ workflow.check_groups.return }}
  partial:
    columns:
    - Problem
    - Reports
    - What to do
    table_config:
      enable_sorting: true
      enable_filtering: true
      enable_download: true

- name: 'Data Check: Save'
  id: check_table_html
  task: persist_text
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.check_table.return }}
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename_suffix: check_table

- name: 'Data Check: Widget'
  id: check_table_widget
  task: create_table_widget_single_view
  skipif:
    conditions:
    - never
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.check_table_html.return }}
